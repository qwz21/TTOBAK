<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>또박</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --stage:#C9CAC5;
    --stage-deep:#AFB1AA;
    --shell:#F2F0EA;
    --shell-edge:#D5D1C6;
    --shell-deep:#BFBBB0;
    --ink:#191B1E;
    --muted:#71767B;
    --red:#E03B2F;
    --green:#37A06A;
    --amber:#DE9A34;
    --dark:#111417;
    --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:var(--sans);color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0%, var(--stage) 0%, var(--stage-deep) 100%);
    min-height:100vh;padding:clamp(16px,3.5vw,40px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto}

  /* ---------- header ---------- */
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{
    width:46px;height:46px;border-radius:12px;background:var(--ink);
    display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
    gap:2px;padding:7px;flex:0 0 auto;
  }
  .mark i{border-radius:1px;background:#2A2E32}
  .mark i.on{background:var(--red);box-shadow:0 0 5px rgba(224,59,47,.9)}
  .brand h1{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .brand h1 span{display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.18em;color:#5E6367;margin-top:3px}

  .stat{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:#5A5F63;text-align:right;line-height:1.9}
  .stat b{color:var(--ink)}

  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}

  .panel{border-radius:20px;padding:18px;box-shadow:0 20px 40px -18px rgba(0,0,0,.4)}
  .panel-cap{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    display:flex;justify-content:space-between;margin-bottom:12px;
  }

  /* ---------- device (left) ---------- */
  .device{
    background:linear-gradient(#F6F4EF,var(--shell));
    border:1px solid var(--shell-edge);border-bottom-color:var(--shell-deep);
  }
  .device .panel-cap{color:#5E6367}

  .ledbar{
    height:38px;border-radius:11px;background:#DEDACF;
    display:flex;align-items:center;gap:11px;padding:0 15px;transition:background .25s;
  }
  .led{
    width:13px;height:13px;border-radius:50%;background:#9AA0A4;
    box-shadow:0 0 0 3px rgba(0,0,0,.05);transition:all .2s;flex:0 0 auto;
  }
  .ledtx{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#5A5F63}
  body.listening .ledbar{background:#DCEFE4}
  body.listening .led{background:var(--green);box-shadow:0 0 0 3px rgba(55,160,106,.2),0 0 14px rgba(55,160,106,.75)}
  body.saving .ledbar{background:#F6DED9}
  body.saving .led{background:var(--red);box-shadow:0 0 0 3px rgba(224,59,47,.2),0 0 16px rgba(224,59,47,.9);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.35}}

  .live{
    margin-top:12px;background:#FBFBF8;border:1px solid #E4E0D6;border-radius:13px;
    padding:16px;min-height:96px;display:flex;align-items:center;
  }
  .live p{font-size:17px;line-height:1.65;color:#22252A}
  .live p.interim{color:#9AA0A4}
  .live p.idle{font-size:14px;color:var(--muted)}

  .cards{margin-top:12px;display:flex;flex-direction:column;gap:9px;min-height:60px}
  .card{
    background:#fff;border:1px solid #E4E0D6;border-left:5px solid var(--ink);
    border-radius:11px;padding:13px 15px;width:100%;font:inherit;text-align:left;cursor:pointer;
    display:flex;align-items:baseline;gap:13px;animation:drop .35s cubic-bezier(.2,.8,.3,1);
  }
  .card:first-child{border-left-color:var(--red)}
  .card:hover{background:#FAF9F5}
  .card:focus-visible{outline:2.5px solid var(--red);outline-offset:2px}
  @keyframes drop{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}
  .c-tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#8A8F93;flex:0 0 auto;min-width:40px;padding-top:3px}
  .c-body{flex:1;min-width:0}
  .c-key{
    display:block;font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.3;
    color:var(--ink);margin-bottom:5px;
  }
  .c-idx{font-size:13px;color:#DE9A34;margin-right:6px;vertical-align:middle;}
  .c-raw{
    display:block;font-size:14px;line-height:1.6;color:#5C6266;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .c-raw.big{font-size:18px;font-weight:600;color:#22252A;line-height:1.5}
  .c-raw mark{background:#FFE9A8;color:#191B1E;font-weight:700;padding:0 2px;border-radius:2px}
  .c-raw.big mark{background:#FFE0A0}
  .c-hint{margin-left:auto;font-family:var(--mono);font-size:9px;color:#B8BCBF;flex:0 0 auto;padding-top:4px}
  .cards-empty{
    border:1px dashed #CFCABE;border-radius:11px;padding:26px 14px;text-align:center;
    font-size:13.5px;color:var(--muted);line-height:1.7;
  }

  /* device 영역(하얀 칸) 안의 버튼 스타일 */
  .device .row {margin-top:12px; margin-bottom:12px;}
  .device .mini {
    background:#fff; border:1px solid #D5D1C6; color:#191B1E; box-shadow:0 2px 4px rgba(0,0,0,.03);
  }
  .device .mini:hover {background:#F6F4EF}
  .device .mini:focus-visible {outline:2px solid var(--ink); outline-offset:2px}
  .device .mini.accent {
    background:var(--green); border-color:#2E8A5A; color:#fff; box-shadow:0 2px 6px rgba(55,160,106,.3);
  }

  /* ---------- control (right) ---------- */
  .ctrl{background:linear-gradient(#22262A,#15181B);border:1px solid #34393E}
  .ctrl .panel-cap{color:#8A9096}

  .bigbtn{
    width:100%;border:none;border-radius:16px;cursor:pointer;
    background:linear-gradient(#FF6A5B,#D8352A);box-shadow:0 6px 0 #A8261D,0 14px 22px -10px rgba(168,38,29,.7);
    color:#fff;font-family:var(--sans);font-size:20px;font-weight:800;padding:20px 16px 22px;
    transition:transform .07s,box-shadow .07s;
  }
  .bigbtn small{display:block;font-size:12px;font-weight:500;opacity:.85;margin-top:5px}
  .bigbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #A8261D,0 6px 12px -8px rgba(168,38,29,.7)}
  .bigbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  body.listening .bigbtn{background:linear-gradient(#4A5157,#2F3438);box-shadow:0 6px 0 #1D2124,0 14px 22px -10px rgba(0,0,0,.6)}
  body.listening .bigbtn:active{box-shadow:0 1px 0 #1D2124}

  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .mini{
    flex:1;min-width:80px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    background:#1C2125;border:1px solid #363C41;border-radius:10px;padding:11px 10px;color:#D5DADE;
  }
  .mini:hover{background:#242A2F}
  .mini:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .mini.on{background:#1D3328;border-color:#2E5A42;color:#8FE0B4}
  .mini.accent{background:#2E3F4A;border-color:#3E5A6A;color:#A9D6EF;}

  .info{
    margin-top:14px;background:#1A1E22;border:1px solid #262B30;border-radius:12px;padding:14px;
    display:flex;flex-direction:column;gap:11px;
  }
  .kv{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .kv span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#767C82}
  .kv b{font-size:13px;color:#E6E9EB;font-weight:700}
  .meter{height:5px;border-radius:3px;background:#262B30;overflow:hidden}
  .meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));transition:width .45s}

  .msg{
    margin-top:12px;border-radius:10px;padding:12px 13px;font-size:12.5px;line-height:1.7;
    background:#2A1E14;border:1px solid #5A4023;color:#E0C08E;display:none;
  }
  .msg.show{display:block}

  /* ---- 소리 설정 ---- */
  .set{
    margin-top:12px;background:#1A1E22;border:1px solid #262B30;border-radius:12px;
    padding:0 14px;
  }
  .set summary{
    cursor:pointer;list-style:none;padding:13px 0;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8A9096;
    display:flex;align-items:center;justify-content:space-between;
  }
  .set summary::-webkit-details-marker{display:none}
  .set summary::after{content:"+";font-size:15px;color:#5E656B}
  .set[open] summary::after{content:"−"}
  .set[open] summary{border-bottom:1px solid #23282C;margin-bottom:12px}
  .set label{
    display:block;font-size:11.5px;color:#9AA1A7;margin-bottom:13px;
  }
  .set label em{float:right;font-style:normal;font-family:var(--mono);font-size:11px;color:#D5DADE}
  .set select{
    width:100%;margin-top:6px;font:inherit;font-size:12.5px;
    background:#12161A;color:#D5DADE;border:1px solid #333A40;border-radius:8px;padding:8px 9px;
  }
  .set input[type=range]{
    width:100%;margin-top:9px;-webkit-appearance:none;appearance:none;
    height:4px;border-radius:2px;background:#333A40;outline:none;
  }
  .set input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:#E6E9EB;cursor:pointer;border:3px solid #1A1E22;box-shadow:0 0 0 1px #4A5157;
  }
  .set input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#E6E9EB;cursor:pointer;border:none;
  }
  .set input[type=range]:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .set .row{padding-bottom:13px}

  .log{
    margin-top:12px;background:#0D1013;border:1px solid #262B30;border-radius:10px;
    padding:11px 12px;height:110px;overflow-y:auto;
    font-family:var(--mono);font-size:10.5px;line-height:1.9;color:#6E757B;
  }
  .log b{color:#A9B0B6;font-weight:400}

  .foot{
    margin-top:22px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;
    color:#5E6367;line-height:2;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="mark" id="mark"></div>
      <h1>또박<span>되묻지 않아도 되는 대화</span></h1>
    </div>
    <div class="stat">
      음성인식 <b id="sttStat">대기</b><br>
      마이크로비트 <b id="serStat">연결 안 됨</b>
    </div>
  </div>

  <div class="grid">

    <!-- ===== 기기 화면 ===== -->
    <section class="panel device">
      <div class="panel-cap"><span>듣는 사람 화면</span><span>최근 3개</span></div>

      <div class="ledbar">
        <span class="led"></span>
        <span class="ledtx" id="ledTx">꺼져 있음</span>
      </div>

      <div class="live">
        <p class="idle" id="liveTx">버튼을 누르면 여기에 들은 말이 나타납니다</p>
      </div>

      <div class="row">
        <button class="mini accent" id="readAllBtn">모두 읽기</button>
        <button class="mini" id="clearBtn">카드 비우기</button>
      </div>

      <div class="cards" id="cards">
        <div class="cards-empty">중요한 말이 카드로 남습니다<br>카드를 누르면 다시 읽어 줍니다</div>
      </div>
    </section>

    <!-- ===== 제어판 ===== -->
    <section class="panel ctrl">
      <div class="panel-cap"><span>제어판</span><span id="modeTx">수동</span></div>

      <button class="bigbtn" id="mainBtn">
        <span id="mainTx">듣기 시작</span>
        <small id="mainSub">누르면 말을 글자로 바꿉니다</small>
      </button>

      <div class="row">
        <button class="mini" id="serBtn">마이크로비트 연결</button>
        <button class="mini" id="demoBtn">시연 문장</button>
      </div>

      <div class="info">
        <div class="kv"><span>저장한 카드</span><b id="cntTx">0</b></div>
        <div class="kv"><span>말 빠르기</span><b id="paceTx">보통</b></div>
        <div class="meter"><i id="meterFill"></i></div>
      </div>

      <div style="margin-top:20px; background:#1A1E22; border:1px solid #262B30; border-radius:12px; padding:14px;">
        <div class="panel-cap" style="color:#8A9096; margin-bottom:12px;">소리 직관 설정</div>
        <div class="row" style="margin-top:0;">
          <button class="mini" id="btnSpeedDown">느리게 말해줘</button>
          <button class="mini" id="btnSpeedUp">빠르게 말해줘</button>
        </div>
        <div class="row">
          <button class="mini" id="btnVolDown">작게 말해줘</button>
          <button class="mini" id="btnVolUp">크게 말해줘</button>
        </div>
        <div class="row" style="margin-top:12px;">
          <button class="mini accent" id="testBtn">이 설정으로 소리 시험</button>
        </div>
      </div>

      <div class="msg" id="msg"></div>

      <div class="log" id="log"></div>
    </section>
  </div>

  <p class="foot">
    크롬 · 엣지 · 웨일에서 열어 주세요 · 음성인식에는 인터넷 연결이 필요합니다<br>
    마이크로비트 연결은 USB 케이블이 꽂혀 있을 때만 가능합니다
  </p>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   0. 요소
   ========================================================= */
const $ = id => document.getElementById(id);
const liveTx=$('liveTx'), cardsEl=$('cards'), ledTx=$('ledTx'),
      mainBtn=$('mainBtn'), mainTx=$('mainTx'), mainSub=$('mainSub'),
      serBtn=$('serBtn'), demoBtn=$('demoBtn'), clearBtn=$('clearBtn'), testBtn=$('testBtn'), readAllBtn=$('readAllBtn'),
      sttStat=$('sttStat'), serStat=$('serStat'), modeTx=$('modeTx'),
      cntTx=$('cntTx'), paceTx=$('paceTx'), meterFill=$('meterFill'),
      msgEl=$('msg'), logEl=$('log'), markEl=$('mark');

const btnSpeedDown=$('btnSpeedDown'), btnSpeedUp=$('btnSpeedUp'),
      btnVolDown=$('btnVolDown'), btnVolUp=$('btnVolUp');

let cards=[], total=0, listening=false, rec=null, demoIdx=0, micStream=null;
let speaking=false, koVoice=null;

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices()||[];
  koVoice = vs.find(v=>v.lang && v.lang.toLowerCase().replace('_','-').indexOf('ko')===0) || null;
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}

/* =========================================================
   1. 로고 마크 (마이크로비트와 같은 모양)
   ========================================================= */
const MARK=[
  "01110",
  "10001",
  "10001",
  "11011",
  "00100"
];
const BEAT=[
  "00000",
  "01010",
  "00000",
  "01010",
  "00000"
];
const cells=[];
for(let i=0;i<25;i++){const d=document.createElement('i');markEl.appendChild(d);cells.push(d);}
function drawMark(pat){
  for(let r=0;r<5;r++)for(let c=0;c<5;c++)
    cells[r*5+c].classList.toggle('on', pat[r][c]==='1');
}
drawMark(MARK);
let beatOn=false;
setInterval(()=>{ if(listening){ beatOn=!beatOn; drawMark(beatOn?BEAT:MARK);} },520);

/* =========================================================
   2. 요약 추출 규칙
   ========================================================= */
const NATIVE={'한':1,'하나':1,'두':2,'둘':2,'세':3,'셋':3,'네':4,'넷':4,'다섯':5,'여섯':6,'일곱':7,'여덟':8,'아홉':9,'열':10,'열한':11,'열두':12};
const SINO={'공':0,'영':0,'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'륙':6,'칠':7,'팔':8,'구':9};
const MINWORD={'반':30,'십':10,'십오':15,'이십':20,'이십오':25,'삼십':30,'사십':40,'사십오':45,'오십':50};
const DEPTS=['내과','외과','정형외과','신경외과','이비인후과','안과','피부과','치과','소아과','소아청소년과','산부인과','신경과','비뇨기과','비뇨의학과','가정의학과','영상의학과','재활의학과','정신건강의학과','응급실','접수처','수납창구','약국','채혈실','검사실'];

const HOUR='(?:열두|열한|열|아홉|여덟|일곱|여섯|다섯|넷|네|셋|세|둘|두|한)';
const reTime=new RegExp('(오전|오후|아침|점심|저녁|낮|밤)?\\s*(\\d{1,2}|'+HOUR+')\\s*시(?!간)\\s*(반|\\d{1,2}\\s*분|(?:십오|삼십|사십오|이십오|이십|십)\\s*분)?','g');
const reDateA=/(\d{1,2})\s*월\s*(\d{1,2})\s*일/;
const reDateB=/(오늘|내일|모레|글피)/;
const reDateC=/(다음|이번|담)\s*주\s*([월화수목금토일])\s*요일/;
const reDateD=/([월화수목금토일])\s*요일/;
const reDateE=/(하루|이틀|사흘|나흘|닷새|엿새|일주일|열흘|보름)\s*(뒤|후|있다가)/;
const reNumA=/(\d{3,8})\s*번/;
const reNumB=/([공영일이삼사오육칠팔구]{3,8})\s*번/;
const reDose=/하루\s*(\d|한|두|세|네|다섯)\s*번/;
const reMeal=/(식후|식전|밥\s*먹고|공복)\s*(?:(\d{1,2}|십|이십|삼십)\s*분)?/;
const reFloor=/((?:본관|신관|별관|동관|서관|응급동)?\s*(?:\d{1,2}|일|이|삼|사|오|육|칠|팔|구|십)\s*층)/;

const TENS={'십':10,'십오':15,'이십':20,'이십오':25,'삼십':30,'사십':40,'사십오':45,'오십':50,'육십':60};
function toNum(s){
  if(!s) return null;
  s=s.trim();
  if(/^\d+$/.test(s)) return parseInt(s,10);
  if(TENS[s]!==undefined) return TENS[s];
  if(NATIVE[s]!==undefined) return NATIVE[s];
  if(SINO[s]!==undefined) return SINO[s];
  return null;
}
function sinoSeq(s){
  let out='';
  for(const ch of s){ if(SINO[ch]===undefined) return null; out+=SINO[ch]; }
  return out;
}

function extract(text){
  const t=text.replace(/\s+/g,' ');
  const got={};

  reTime.lastIndex=0;
  const mt=reTime.exec(t);
  if(mt){
    const h=toNum(mt[2]);
    if(h!==null){
      let m=0;
      if(mt[3]){
        const raw=mt[3].replace(/\s*분/,'').trim();
        m = MINWORD[raw]!==undefined ? MINWORD[raw] : (parseInt(raw,10)||0);
      }
      const ap=mt[1]?mt[1]+' ':'';
      got.time = ap + h + ':' + String(m).padStart(2,'0');
    }
  }

  let md;
  if((md=reDateA.exec(t))) got.date=md[1]+'월 '+md[2]+'일';
  else if((md=reDateC.exec(t))) got.date=(md[1]==='다음'||md[1]==='담'?'다음 주 ':'이번 주 ')+md[2]+'요일';
  else if((md=reDateB.exec(t))) got.date=md[1];
  else if((md=reDateE.exec(t))) got.date=md[1]+' 뒤';
  else if((md=reDateD.exec(t))) got.date=md[1]+'요일';

  let mn;
  if((mn=reNumA.exec(t))) got.num=mn[1]+'번';
  else if((mn=reNumB.exec(t))){ const s=sinoSeq(mn[1]); if(s) got.num=s+'번'; }

  const mdo=reDose.exec(t);
  if(mdo){ const n=toNum(mdo[1]); if(n) got.dose='하루 '+n+'번'; }
  const mm=reMeal.exec(t);
  if(mm){
    let s=mm[1].replace(/\s/g,'');
    if(mm[2]){ const n=toNum(mm[2]); if(n) s+=' '+n+'분'; }
    got.meal=s;
  }

  const mf=reFloor.exec(t);
  if(mf){
    const s=mf[1].replace(/\s+/g,'');
    const mb=s.match(/^(본관|신관|별관|동관|서관|응급동)?(.+)층$/);
    if(mb){
      const n=toNum(mb[2]);
      got.place=(mb[1]?mb[1]+' ':'')+(n!==null?n:mb[2])+'층';
    }else got.place=s;
  }
  for(const d of DEPTS){ if(t.indexOf(d)>=0){ got.dept=d; break; } }

  return got;
}

const TAGS=[
  {tag:'약',   keys:['약','복용','처방','알약','물약','연고','드세요','챙겨']},
  {tag:'접수', keys:['접수','수납','계산','창구','번호표']},
  {tag:'예약', keys:['예약','잡아','다음에 오','또 오']},
  {tag:'검사', keys:['검사','채혈','엑스레이','피 뽑','소변','초음파']},
  {tag:'병원', keys:['병원','내원','진료','외래','검진','진찰','오세요','오시면','올라오']},
  {tag:'장소', keys:['층','본관','신관','별관','과로','실로']}
];

function pickTag(text){
  for(const t of TAGS){ if(t.keys.some(k=>text.indexOf(k)>=0)) return t.tag; }
  return '메모';
}

function makeCard(text){
  const raw=text.trim().replace(/\s+/g,' ');
  if(raw.length<2) return null;

  const g=extract(raw);
  const bits=[];
  if(g.date)  bits.push(g.date);
  if(g.time)  bits.push(g.time);
  if(g.num)   bits.push(g.num);
  if(g.dose)  bits.push(g.dose);
  if(g.meal)  bits.push(g.meal);
  if(g.place) bits.push(g.place);
  if(g.dept)  bits.push(g.dept);

  return { tag:pickTag(raw), key:bits.join(' · '), raw:raw, index:0 };
}

function escapeHtml(s){
  return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function mark(s){
  return escapeHtml(s)
    .replace(/(\d+\s*(?:시|분|번|일|월|층|알|정|개|주일)?)/g,'<mark>$1</mark>')
    .replace(/((?:오전|오후)\s*)/g,'<mark>$1</mark>')
    .replace(/((?:열두|열한|열|아홉|여덟|일곱|여섯|다섯|넷|네|셋|세|둘|두|한)\s*시(?!간))/g,'<mark>$1</mark>')
    .replace(/((?:하루|한|두|세|네)\s*번)/g,'<mark>$1</mark>')
    .replace(/((?:식전|식후|공복))/g,'<mark>$1</mark>');
}

/* =========================================================
   3. 카드 관리
   ========================================================= */
function addCard(text){
  total++;
  const c=makeCard(text);
  if(!c){ total--; return false; } 
  
  c.index = total; // 부여된 고유 번호 할당
  cards.unshift(c);
  if(cards.length>3) cards.pop();
  
  render();
  updateInfo();
  log(c.index+'번 저장 → '+(c.key || c.raw.slice(0,16)));
  return true;
}

function render(){
  cardsEl.innerHTML='';
  if(!cards.length){
    cardsEl.innerHTML='<div class="cards-empty">중요한 말이 카드로 남습니다<br>카드를 누르면 다시 읽어 줍니다</div>';
    return;
  }
  cards.forEach(c=>{
    const b=document.createElement('button');
    b.className='card';
    let inner='<span class="c-tag">'+c.tag+'</span><span class="c-body">';
    if(c.key) inner+=`<span class="c-key"><span class="c-idx">${c.index}.</span>${escapeHtml(c.key)}</span>`;
    inner+='<span class="'+(c.key?'c-raw':'c-raw big')+'">';
    if(!c.key) inner+=`<span class="c-idx">${c.index}.</span>`;
    inner+=mark(c.raw)+'</span>';
    inner+='</span><span class="c-hint">듣기</span>';
    b.innerHTML=inner;
    b.addEventListener('click',()=>speak(c));
    cardsEl.appendChild(b);
  });
}

let curUtter=null;
let resumeTimer=null;

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

const NAT_NUM = {1:'한', 2:'두', 3:'세', 4:'네', 5:'다섯', 6:'여섯', 7:'일곱', 8:'여덟', 9:'아홉', 10:'열', 11:'열한', 12:'열두'};

function toSpeech(s){
  const sep = '. ';
  let text = s.replace(/\s*·\s*/g, sep);
  
  // 시간(9:30)을 "아홉시 30분" 처럼 고유어로 변환하여 '구시'로 잘못 읽히는 현상 방지
  text = text.replace(/(\d{1,2}):(\d{2})/g, (m, h, mi) => {
    const hh = NAT_NUM[parseInt(h, 10)] || h;
    const mm = mi === '00' ? '' : parseInt(mi, 10) + '분';
    return hh + '시 ' + mm;
  });
  
  // 하루 3번 -> 하루 세 번으로 변환
  text = text.replace(/하루\s*(\d+)\s*번/g, (m, n) => {
    const count = NAT_NUM[parseInt(n, 10)] || n;
    return '하루 ' + count + '번';
  });

  return text.replace(/\s{2,}/g,' ').trim();
}

function waitVoices(){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)) return res();
    if((speechSynthesis.getVoices()||[]).length){ loadVoices(); return res(); }
    let n=0;
    const t=setInterval(()=>{
      n++;
      if((speechSynthesis.getVoices()||[]).length || n>20){ clearInterval(t); loadVoices(); res(); }
    },100);
  });
}

let currentRate = 0.85;
let currentVol = 1.0;

const SET={
  rate: () => currentRate,
  pitch: () => 1.0,
  vol: () => currentVol,
  voice: () => koVoice
};

function tryRead(text, useVoice){
  return new Promise(resolve=>{
    const u=new SpeechSynthesisUtterance(text);
    curUtter=u;
    u.lang='ko-KR';
    u.rate=SET.rate();
    u.pitch=SET.pitch();
    u.volume=SET.vol();
    const pick=SET.voice();
    if(useVoice && pick) u.voice=pick;

    let done=false, started=false;
    const finish=v=>{
      if(done) return; done=true;
      clearInterval(resumeTimer); resumeTimer=null;
      resolve({result:v, started:started});
    };

    u.onstart=()=>{
      started=true;
      log('읽기 시작');
      clearInterval(resumeTimer);
      resumeTimer=setInterval(()=>{
        if(speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.resume();
      },4000);
    };
    u.onend  =()=>finish('ok');
    u.onerror=e=>finish(e.error||'error');

    try{
      speechSynthesis.speak(u);
    }catch(err){ finish('throw'); }

    setTimeout(()=>{
      if(!done && !started && !speechSynthesis.speaking && !speechSynthesis.pending) finish('silent');
    },1600);
  });
}

// speak() 함수 개선: 객체일 때 안내 음성을 추가하고, 잘림 방지를 위해 딜레이 대폭 향상
async function speak(c, isSequence = false){
  if(!('speechSynthesis' in window)){
    showMsg('이 브라우저는 읽어주기를 지원하지 않습니다.');
    return;
  }
  
  let src = "";
  let prefix = "";
  
  if (typeof c === 'string') {
    src = c;
  } else {
    src = (c.key ? c.key+', '+c.raw : c.raw);
    prefix = c.index ? `${c.index}번 기록입니다. ` : ""; // 로딩 안내 음성 추가
  }

  const text = prefix + toSpeech(src);
  speaking=true;

  // 연속 읽기 모드(isSequence)가 아닐 때만 마이크 단독 제어 (안정성 확보 위해 sleep 늘림)
  if(!isSequence && listening && rec){ try{ rec.stop(); }catch(e){} await sleep(600); }

  await waitVoices();
  
  // 찌꺼기 비운 후 넉넉히 대기
  if(speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); await sleep(300); }

  // 꼼수 1: 더미(Wake-up) 음성으로 엔진 시동 걸기
  let wakeUp = new SpeechSynthesisUtterance(" ");
  wakeUp.volume = 0;
  speechSynthesis.speak(wakeUp);
  await sleep(150);

  // 1차: 한국어 음성 지정 시도
  let r = await tryRead(text, true);

  if(!r.started && r.result!=='ok'){
    log('시작 실패 ('+r.result+') · 기본 음성으로 재시도');
    speechSynthesis.cancel();
    await sleep(300);
    r = await tryRead(text, false);
  }

  if(!r.started && r.result!=='ok'){
    log('읽어주기 실패: '+r.result);
    showMsg('읽어주기가 동작하지 않습니다. 소리 설정을 확인해 주세요.');
  }else{
    log('읽어줌 → '+text);
  }

  speaking=false;
  if(!isSequence && listening && rec){ try{ rec.start(); }catch(e){} }
}

// 한 번에 모두 읽기 기능
async function speakAll() {
  if (cards.length === 0) {
    showMsg('읽을 카드가 없습니다.');
    return;
  }
  
  // 연속 읽기를 위해 음성인식을 먼저 완전히 끔
  if (listening && rec) { try { rec.stop(); } catch(e){} await sleep(600); }
  
  // 카드를 시간순(오래된 순)으로 정렬하여 차례대로 읽기
  const chronologicalCards = cards.slice().reverse();
  for (let i = 0; i < chronologicalCards.length; i++) {
     await speak(chronologicalCards[i], true); // 연속 읽기 모드 플래그 전달
     await sleep(400); // 문장 사이 틈
  }
  
  // 모두 읽기가 끝난 후 음성인식 복구
  if (listening && rec) { try { rec.start(); } catch(e){} }
}

async function voiceTest(){
  hideMsg();
  if(!('speechSynthesis' in window)){ log('speechSynthesis 없음'); return; }
  await waitVoices();
  const vs=speechSynthesis.getVoices()||[];
  log('음성 개수: '+vs.length);
  const ko=vs.filter(v=>v.lang && v.lang.toLowerCase().replace('_','-').indexOf('ko')===0);
  if(ko.length){ ko.forEach(v=>log('한국어 · '+v.name)); }
  else{ log('한국어 음성 없음'); vs.slice(0,3).forEach(v=>log('있는 것 · '+v.name+' ('+v.lang+')')); }
  await speak('또박. 소리 시험입니다');
}

function updateInfo(){
  cntTx.textContent=total;
  meterFill.style.width=Math.min(total*18,100)+'%';
  paceTx.textContent = total>=5 ? '빠름' : (total>=3 ? '조금 빠름' : '보통');
}

/* =========================================================
   4. 음성 인식
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function buildRec(){
  if(!SR){
    showMsg('이 브라우저는 음성인식을 지원하지 않습니다. 크롬·엣지·웨일에서 열어 주세요. 그동안 [시연 문장] 버튼으로 확인할 수 있습니다.');
    sttStat.textContent='지원 안 됨';
    return null;
  }
  const r=new SR();
  r.lang='ko-KR';
  r.continuous=true;
  r.interimResults=true;

  r.onstart=()=>{ sttStat.textContent='듣는 중'; log('인식 시작'); };

  r.onresult=e=>{
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    if(interim){ liveTx.textContent=interim; liveTx.className='interim'; }
    if(final){
      liveTx.textContent=final; liveTx.className='';
      flashSave();
      addCard(final);
    }
  };

  r.onerror=ev=>{
    log('오류: '+ev.error);
    if(ev.error==='not-allowed'){
      showMsg('마이크 권한이 거부되었습니다.');
      stop();
    }else if(ev.error==='network'){
      showMsg('인터넷 연결이 필요합니다.');
      stop();
    }
  };

  r.onend=()=>{
    sttStat.textContent = listening ? '재시작' : '대기';
    if(listening && !speaking){ try{ r.start(); }catch(e){} } 
  };
  return r;
}

async function start(){
  if(listening) return;
  listening=true;
  document.body.classList.add('listening');
  ledTx.textContent='듣고 있어요';
  mainTx.textContent='듣기 멈춤';
  mainSub.textContent='다시 누르면 멈춥니다';
  liveTx.textContent='말씀하세요…'; liveTx.className='idle';
  hideMsg();

  if(!micStream && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{
      micStream=await navigator.mediaDevices.getUserMedia({audio:true});
      log('마이크 확보');
    }catch(e){
      log('마이크 직접 확보 실패 · 인식만 시도');
    }
  }

  if(!rec) rec=buildRec();
  if(rec){ try{ rec.start(); }catch(e){ log('시작 실패'); } }
}

function stop(){
  listening=false;
  document.body.classList.remove('listening');
  drawMark(MARK);
  ledTx.textContent='꺼져 있음';
  mainTx.textContent='듣기 시작';
  mainSub.textContent='누르면 말을 글자로 바꿉니다';
  sttStat.textContent='대기';
  if(rec){ try{ rec.stop(); }catch(e){} }
  log('인식 멈춤');
}

function toggle(){ listening ? stop() : start(); }

function flashSave(){
  document.body.classList.add('saving');
  setTimeout(()=>document.body.classList.remove('saving'),900);
}

/* =========================================================
   5. 마이크로비트 (Web Serial)
   ========================================================= */
let port=null;

async function connectSerial(){
  if(!('serial' in navigator)){
    showMsg('이 브라우저는 마이크로비트 연결(Web Serial)을 지원하지 않습니다.');
    return;
  }
  try{
    port=await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    serStat.textContent='연결됨';
    serBtn.classList.add('on');
    serBtn.textContent='마이크로비트 연결됨';
    modeTx.textContent='버튼 연동';
    log('마이크로비트 연결');
    readLoop();
  }catch(e){
    log('연결 취소 또는 실패');
  }
}

async function readLoop(){
  const dec=new TextDecoderStream();
  port.readable.pipeTo(dec.writable).catch(()=>{});
  const reader=dec.readable.getReader();
  let buf='';
  try{
    while(true){
      const {value,done}=await reader.read();
      if(done) break;
      buf+=value;
      let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim();
        buf=buf.slice(i+1);
        if(!line) continue;
        log('◀ '+line);
        if(line.indexOf('START')>=0) start();
        else if(line.indexOf('STOP')>=0) stop();
      }
    }
  }catch(e){ log('연결 끊김'); }
  serStat.textContent='연결 안 됨';
  serBtn.classList.remove('on');
  serBtn.textContent='마이크로비트 연결';
  modeTx.textContent='수동';
}
